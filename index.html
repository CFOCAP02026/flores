<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galaxia de Flores Amarillas 21 de Septiembre 🌻✨</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="title-banner">
    <h1>✨ GALAXIA DE FLORES AMARILLAS ✨</h1>
    <p>21 DE SEPTIEMBRE • ERES MI UNIVERSO</p>
  </header>

  <canvas id="spaceCanvas"></canvas>

  <div class="galaxy-container" id="galaxyContainer"></div>

  <div class="controls-panel">
    <div class="input-group">
      <input type="text" id="flowerInput" placeholder="Añade una frase..." maxlength="20">
      <select id="iconSelect">
        <option value="🌻">🌻 Girasoles</option>
        <option value="💐">💐 Rosas</option>
        <option value="⭐">⭐ Estrella</option>
        <option value="💛">💛 Corazón</option>
      </select>
      <button id="addBtn" class="btn-primary">+ Agregar</button>
    </div>

    <div class="actions-group">
      <button id="petalRainBtn" class="btn-secondary">🌧️ Lluvia Pétalos</button>
      <button id="audioBtn" class="btn-secondary">🎵 Música</button>
    </div>
  </div>

  <div class="modal-overlay" id="letterModal">
    <div class="modal-card">
      <span class="close-modal" id="closeModal">&times;</span>
      <div class="modal-icon" id="modalIcon">🌻</div>
      <h2 id="modalTitle">Mi Sol</h2>
      <p id="modalBody">Gracias por ser la luz que ilumina mi camino todos los días. ¡Feliz 21 de septiembre!</p>
      <div class="modal-footer">Para ti con todo mi amor ❤️</div>
    </div>
  </div>

  <audio id="bgMusic" src="flores.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
