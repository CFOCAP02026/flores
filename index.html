<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxia de Flores Amarillas 21 de Septiembre 🌻✨</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="title-banner">
    <h1>✨ GALAXIA DE FLORES AMARILLAS ✨</h1>
    <p>21 DE SEPTIEMBRE • ERES MI UNIVERSO</p>
  </header>

  <canvas id="spaceCanvas"></canvas>

  <div class="galaxy-container" id="galaxyContainer"></div>

  <div class="controls-panel">
    <div class="input-group">
      <input type="text" id="flowerInput" placeholder="Añade una frase o palabra..." maxlength="20">
      <select id="iconSelect">
        <option value="🌻">🌻 Ramo de Girasoles</option>
        <option value="💐">💐 Ramo de Rosas Amarillas</option>
        <option value="⭐">⭐ Estrella Dorada</option>
        <option value="💛">💛 Corazón Brillantina</option>
      </select>
      <button id="addBtn" class="btn-primary">+ Agregar</button>
    </div>

    <div class="actions-group">
      <button id="petalRainBtn" class="btn-secondary">🌧️ Lluvia de Pétalos</button>
      <button id="audioBtn" class="btn-secondary">🎵 Música Espacial</button>
    </div>
  </div>

  <div class="modal-overlay" id="letterModal">
    <div class="modal-card">
      <span class="close-modal" id="closeModal">&times;</span>
      <div class="modal-icon" id="modalIcon">🌻</div>
      <h2 id="modalTitle">Mi Sol</h2>
      <p id="modalBody">Gracias por ser la luz que ilumina mi camino todos los días. ¡Feliz 21 de septiembre!</p>
      <div class="modal-footer">Para ti con todo mi amor ❤️</div>
    </div>
  </div>
  <audio id="bgMusic" src="Chino & Nacho - Niña Bonita [ Lyrics Letras ].mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
